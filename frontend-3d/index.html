<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>NASA Artemis: Outpost 3D Lunar Base</title>
  <style>
    /* Full Viewport 3D Canvas Styling Reset */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    #scene-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      overflow: hidden;
    }

    #scene-container canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    #hud-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
    }

    #hud-overlay > * {
      pointer-events: auto;
    }

    #modal-root {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 100;
      pointer-events: none;
    }

    #modal-root > * {
      pointer-events: auto;
    }

    /* Kid-Friendly Aerospace Animations & Micro-Interactions */
    .kid-arcade-btn {
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s ease, filter 0.15s ease;
      cursor: pointer;
      font-weight: 700;
      user-select: none;
    }
    .kid-arcade-btn:hover {
      transform: translateY(-2px) scale(1.02);
      filter: brightness(1.12);
    }
    .kid-arcade-btn:active {
      transform: translateY(1px) scale(0.97);
      filter: brightness(0.95);
    }

    .kid-resource-capsule {
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.18s ease;
      cursor: default;
      user-select: none;
    }
    .kid-resource-capsule:hover {
      transform: translateY(-2px) scale(1.04);
    }

    .kid-building-card {
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease, border-color 0.2s ease;
      user-select: none;
    }
    .kid-building-card:hover {
      transform: translateY(-5px) scale(1.03);
    }

    @keyframes kid-milo-bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    @keyframes kid-glow-pulse {
      0%, 100% { box-shadow: 0 0 16px rgba(56, 189, 248, 0.4); }
      50% { box-shadow: 0 0 28px rgba(56, 189, 248, 0.75); }
    }

    @keyframes kid-alert-pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }
      50% { transform: scale(1.02); box-shadow: 0 0 30px rgba(245, 158, 11, 0.85); }
    }

    @keyframes kid-pop-in {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes kid-star-twinkle {
      0%, 100% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.15) rotate(6deg); }
    }

    /* Custom Sleek Scrollbar */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
      border-radius: 8px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(56, 189, 248, 0.4);
      border-radius: 8px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(56, 189, 248, 0.8);
    }
  </style>
</head>
<body>
  <div id="scene-container"></div>
  <div id="hud-overlay"></div>
  <div id="modal-root"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
